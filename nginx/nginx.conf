server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Front-end assets (JS/CSS) are content-hashed by Vite — cache forever.
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Non-hashed media — short cache.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback (no client routes today, but harmless to keep).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
